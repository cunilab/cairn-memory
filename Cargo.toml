[workspace]
members = ["crates/core", "crates/server", "crates/storage", "crates/client"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.2"

[workspace.dependencies]
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["json", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
