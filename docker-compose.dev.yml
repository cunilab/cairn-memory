# Isolated dev stack. Use scripts/dev_up.sh / scripts/dev_down.sh.
name: cairn-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cairn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev_up.sh}
      POSTGRES_DB: cairn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cairn -d cairn"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      CAIRN_DATABASE_URL: postgres://cairn:${POSTGRES_PASSWORD}@postgres:5432/cairn
      # The address agents on this machine use; the console shows it in the device setup command.
      CAIRN_PUBLIC_URL: http://127.0.0.1:58080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:58080:3111"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3111/cairn-memory/health"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      CAIRN_API_URL: http://server:3111
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:53000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/login"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
