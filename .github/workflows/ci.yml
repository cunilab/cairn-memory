# Required checks for pull requests into main. Job names are the check names; renaming a job
# breaks branch protection until the rule is updated.
# Jobs that need PostgreSQL (rust-tests, acceptance-smokes) each run the same
# pgvector/pgvector:pg17 service and the same CAIRN_TEST_DATABASE_URL. Tests and smokes isolate
# themselves in a schema, so one database serves all of them (spec docs/specs/0.1.6-foundation.md, section 5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main; a newer push should not hide a failure there.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-format-and-lint:
    name: Rust format and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: no human review queue (tables, routes, pages)
        # bench_distractors.py is generated corpus text, not code ("Reference for reviews.").
        run: |
          if grep -rniE 'similarity.review|review_queue|reviews' --exclude=bench_distractors.py crates apps/web/app apps/web/components scripts; then
            echo "the human review queue is gone (CM-SPEC-008 P11); do not bring it back" >&2
            exit 1
          fi
      - name: no rate limiter, no human job controls (owner decisions, CM-SPEC-009)
        run: |
          if grep -rniE 'rate_limited|AuthRateLimiter|requeue_job|discard_job|jobs/\{job_id\}' crates/server/src crates/store/src; then
            echo "Cairn has no auth rate limiter or lockout, and jobs are read-only (retried automatically)" >&2
            exit 1
          fi
      - name: the web reads no retired route and matches no English error text (CM-SPEC-009)
        # Quoted names only: "memories/export" (the current export) and "@/lib/export" do not match.
        run: |
          if grep -rnE --exclude-dir=generated --exclude='*.test.ts' "SESSION_REQUIRED_MESSAGES|[\"'\`](delete|diagnose|export)[\"'\`]|/cairn-memory/(delete|diagnose|export)" apps/web/app apps/web/components apps/web/lib apps/web/hooks crates/server/src; then
            echo "the console uses /forget, /stats and GET /memories/export, and switches on error codes" >&2
            exit 1
          fi
      - name: cairn-core stays pure (no sqlx, tokio, axum or reqwest)
        run: |
          tree="$(cargo tree -p cairn-core -e normal --locked)"
          if printf '%s\n' "$tree" | grep -E 'sqlx|tokio|axum|reqwest'; then
            echo "cairn-core must not depend on sqlx, tokio, axum or reqwest" >&2
            exit 1
          fi

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@127.0.0.1:5432/postgres
      CAIRN_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The runner context is not available in a job-level env, so the model path is set here.
      - run: echo "CAIRN_TEST_EMBEDDING_MODEL_DIR=$RUNNER_TEMP/cairn-minilm" >> "$GITHUB_ENV"
      - run: python3 scripts/test_download_embedding_model.py
      - run: python3 scripts/download_embedding_model.py "$CAIRN_TEST_EMBEDDING_MODEL_DIR"
      - run: cargo test --workspace --locked
      - name: generated web types are current (ts-rs, spec W4)
        # Regenerate from scratch so a removed type also shows up; `add -N` makes new files count.
        run: |
          rm -rf apps/web/lib/generated
          cargo test --workspace --features ts --locked export_bindings
          git add -N apps/web/lib/generated
          git diff --exit-code apps/web/lib/generated

  build-other-platforms:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked -p cairn-client -p cairn-server
      - run: cargo test --locked -p cairn-client --lib --no-run

  web-console:
    name: Web console typecheck, lint, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  acceptance-smokes:
    name: Acceptance smokes
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CAIRN_TEST_DATABASE_URL: postgres://cairn:cairn@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: apps/web
      # The smokes do not pass --embedding-model-dir. Server startup then keeps
      # lexical, entity, and link recall and leaves semantic search disabled
      # (crates/server/src/main.rs). The pinned model stays on the Rust tests job.
      - run: ./scripts/smoke_mcp.sh
      - run: ./scripts/smoke_web.sh

  bench:
    name: Bench
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python3 scripts/download_embedding_model.py "$RUNNER_TEMP/cairn-minilm"
      # bench.py builds the workspace and starts its own pgvector container.
      # v2 main set on a store with 2,000 unrelated memories is the headline (spec 0.1.6-step5 sections 13 and 14):
      # hit@5 0.651 and no card on all 14 weak queries (gate: one cosine bar tau_s = 0.43, no weak path).
      # The gates are those minus a small margin; they catch a regression and do not claim the numbers are good.
      - run: python3 scripts/bench.py --out "$RUNNER_TEMP/bench-v2.json" --model-dir "$RUNNER_TEMP/cairn-minilm" --questions questions-v2.json --distractors 2000 --min-hit5 0.60 --max-weak-hits 0
      # v1 main set on the 70-memory corpus, kept for history: 0.92 (23 of 25) and no weak card. 0.88 allows one miss.
      - run: python3 scripts/bench.py --skip-build --out "$RUNNER_TEMP/bench-v1.json" --model-dir "$RUNNER_TEMP/cairn-minilm" --min-hit5 0.88 --max-weak-hits 0 --min-link-ratio 0.60
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench
          path: ${{ runner.temp }}/bench-*.json
          if-no-files-found: ignore

  docker-images:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Build only, never pushed: the release workflow pushes. This catches a broken Dockerfile (a
      # missing COPY, a failing build) in the pull request instead of at tag time.
      - run: docker build -f docker/server.Dockerfile -t cairn-memory-server:ci .
      - run: docker build -f docker/web.Dockerfile -t cairn-memory-web:ci .

  docs-validation:
    name: Documentation validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_phase0.py
      - run: python3 scripts/check_update_assets.py
      - run: python3 scripts/check_web_version.py
