# Publishes a GitHub Release when a vX.Y.Z tag is pushed. The tag must equal the workspace
# version and point at a commit on main. Assets are raw binaries (no archives) so
# `cairn update` needs no unpacking: cairn-<target>[.exe], cairn-server-<target>[.exe],
# cairn_hook.py, cairn_outbox.py, and SHA256SUMS over all of them. The image jobs then build
# each platform natively and the manifest jobs publish ghcr.io/cunilab/cairn-memory-server and
# cairn-memory-web (vX.Y.Z and latest, linux/amd64 and linux/arm64).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Tag matches the workspace version and is on main
        run: |
          version="$(awk '/^\[workspace.package\]/{p=1; next} /^\[/{p=0} p && $1=="version"{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be MAJOR.MINOR.PATCH" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main" >&2; exit 1; }

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, ext: "" }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl, ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          # Linux builds are static musl binaries, so they run on any distribution; the C
          # code in ring is compiled with musl-gcc.
          case "${{ matrix.target }}" in
            *-musl) export "CC_$(echo "${{ matrix.target }}" | tr - _)=musl-gcc" ;;
          esac
          cargo build --release --locked --target ${{ matrix.target }} -p cairn-client -p cairn-server
      - name: Stage raw assets
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/cairn${{ matrix.ext }}" "dist/cairn-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/cairn-server${{ matrix.ext }}" "dist/cairn-server-${{ matrix.target }}${{ matrix.ext }}"
      - name: The staged CLI runs on this runner
        shell: bash
        run: ./dist/cairn-${{ matrix.target }}${{ matrix.ext }} --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Add hook scripts and checksums
        working-directory: dist
        run: |
          cp ../scripts/cairn_hook.py ../scripts/cairn_outbox.py .
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes

  image:
    name: Image ${{ matrix.image }} ${{ matrix.platform }}
    needs: publish
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [server, web]
        include:
          - { platform: linux/amd64, os: ubuntu-24.04, arch: amd64 }
          - { platform: linux/arm64, os: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Each platform builds natively and is pushed by digest only; the merge job tags the manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.source=https://github.com/cunilab/cairn-memory
          outputs: type=image,name=ghcr.io/cunilab/cairn-memory-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Manifest ${{ matrix.image }}
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/cunilab/cairn-memory-${{ matrix.image }}
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/cunilab/cairn-memory" \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" "${refs[@]}"
      - name: Inspect
        env:
          IMAGE: ghcr.io/cunilab/cairn-memory-${{ matrix.image }}
        run: docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
